[project]
name = "open-outcome-example-research-engineering"
version = "0.1.0"
description = "End-to-end example consuming research-engineering through the Open Outcome SDK."
requires-python = ">=3.11"
dependencies = [
    "open-outcome",
    "research-engineering @ git+https://github.com/opensubagents/research-engineering@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["example*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
open-outcome = { path = "../../sdk-python", editable = true }
