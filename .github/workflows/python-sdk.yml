name: python-sdk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install sdk-python
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: pytest
        working-directory: sdk-python
        run: pytest -q

  example-research-engineering:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check out sibling opensubagents/research-engineering
        uses: actions/checkout@v4
        with:
          repository: opensubagents/research-engineering
          path: _siblings/research-engineering
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sdk-python (open-outcome) and research-engineering from paths
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk-python[dev]
          pip install -e ./_siblings/research-engineering
      - name: Install example
        working-directory: examples/research-engineering
        run: pip install -e .
      - name: Run end-to-end
        working-directory: examples/research-engineering
        run: pytest -q
